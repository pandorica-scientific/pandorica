# Keeps the README and CITATION.cff citation versions in step with pandorica/_version.py.
# Install once with:  pre-commit install
# Run on demand with: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: sync-citation-version
        name: Sync README citation version from _version.py
        entry: python scripts/sync_version.py
        language: system
        # Only trigger when the version source or the README changes.
        files: ^(pandorica/_version\.py|README\.md|CITATION\.cff)$
        pass_filenames: false
