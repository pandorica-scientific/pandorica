name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened and what you expected}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps or command to reproduce, render: shell}
  - type: input
    id: version
    attributes: {label: Version or commit}
