name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      # tests marked `data` need the private FemalePN stack (PANDORICA_TEST_DATA) and skip here
      - run: uv run pytest -q
      - run: python scripts/sync_version.py --check
